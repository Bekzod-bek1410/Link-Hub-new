<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bekzod J. | Link Hub</title>
    <meta name="description" content="Ux/Ui designer & Web Designer - Link Hub">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Decoration -->
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="avatar-wrapper">
                <img src="assets/profile_pic.png" alt="Bekzod J." class="avatar">
            </div>
            <h1 class="name">Bekzod Jahongirov</h1>
        </header>

        <!-- Links Grid -->
        <main class="links-grid">
            <!-- Telegram -->
            <a href="https://t.me/Maqsadjoovich" class="button-link" target="_blank">
                <div class="link-content">
                    <div class="icon-box">
                        <i data-lucide="send"></i>
                    </div>
                    <span class="link-title">Telegram</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/bekzod_jahongirov" class="button-link" target="_blank">
                <div class="link-content">
                    <div class="icon-box">
                        <i data-lucide="instagram"></i>
                    </div>
                    <span class="link-title">Instagram</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Portfolio (Placeholder for future) -->
            <a href="#" class="button-link">
                <div class="link-content">
                    <div class="icon-box">
                        <i data-lucide="layout"></i>
                    </div>
                    <span class="link-title">Portfolio</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Contact -->
            <a href="tel:+998880745515" class="button-link">
                <div class="link-content">
                    <div class="icon-box">
                        <i data-lucide="phone"></i>
                    </div>
                    <span class="link-title">Bog'lanish</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>
        </main>

        <footer class="footer">
            <p>© 2026 Crafted with ❤️ for modern web.</p>
        </footer>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
